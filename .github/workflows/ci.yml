# Проверки перед деплоем. Railway выкладывает master только после успешного прохождения
# (настройка сервиса «Wait for CI»).
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: HTTP integration
        run: npm run test:integration
      - name: Admin integration
        run: npm run test:admin
      - name: Bilingual integration
        run: npm run test:bilingual
